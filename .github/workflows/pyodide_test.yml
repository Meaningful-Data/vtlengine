name: Pyodide test

on:
  pull_request:
    branches: ["main", "1.6.X", "1.9.X"]
    # Only pull requests that change what the wheel depends on, or the check itself; the
    # weekly run below covers everything else (no merge_group trigger for the same reason).
    paths:
      - "pyproject.toml"
      - ".github/workflows/pyodide_test.yml"
      - "scripts/check_micropip_install.mjs"
      - "scripts/check_install.py"
  schedule:
    # Weekly, Mondays 06:00 UTC. Both stages resolve dependencies against PyPI as it is on
    # the day, so a new release of a dependency can break an install with no change in this
    # repository. GitHub runs scheduled workflows from the default branch: the wasm stage then
    # builds that branch, the pip stage the latest release on PyPI, whatever the branch.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pyodide-test:
    name: Build the wasm wheel, run tests/API in a pyodide venv, check the micropip install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache the Pyodide cross-build toolchain
        # cibuildwheel downloads its host Python 3.14, the Pyodide cross-build
        # environment, Emscripten and Node.js into this directory (about 1 GB); keep
        # them between runs. The set is fixed by the cibuildwheel version, hence the key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cibuildwheel
          key: cibuildwheel-pyodide-${{ runner.os }}-1828c10ab37f080699c7b81cea34097c684a7074

      - name: Build the WebAssembly wheel and run tests/API in a pyodide venv
        # The same build as release.yml: cp314-pyodide_wasm32 (PEP 783
        # pyemscripten_2026_0_wasm32 tag), with tests/API run against the installed
        # wheel in cibuildwheel's `pyodide venv` ([tool.cibuildwheel.pyodide] in
        # pyproject.toml).
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          only: cp314-pyodide_wasm32

      - name: Check that the wheel installs with micropip on stock Pyodide
        # What a Pyodide user runs: micropip resolving the wheel's dependencies against
        # the Pyodide lockfile and PyPI (no backtracking), then scripts/check_install.py
        # (`import vtlengine` and one statement on both engines). The `pyodide` npm package
        # must be the line the wheel targets (314.x = pyemscripten_2026_0); keep it in step
        # with release.yml and docs/jupyterlite/build.sh.
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts pyodide@314.0.6
          node scripts/check_micropip_install.mjs wheelhouse/vtlengine-*.whl

  pip-install-latest:
    name: pip install vtlengine (latest release), ${{ matrix.os }}, Python ${{ matrix.python-version }}
    # The release users install today, with pip's own resolution against PyPI (no lock):
    # scheduled and manual runs only, since a pull request cannot change that outcome.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every interpreter the wheels are published for (requires-python >= 3.9).
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        # Only for scripts/check_install.py; the package under test comes from PyPI.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: pip install vtlengine
        # bash on every OS so that a failing command fails the step (pwsh only reports the last).
        shell: bash
        run: |
          python -m pip install vtlengine
          python -m pip check
          python -m pip list

      - name: Import vtlengine, run one statement on both engines, confirm it is the latest release
        shell: bash
        run: python scripts/check_install.py --latest
