name: Testing

on:
  pull_request:
    branches: ["main", "1.6.X", "1.9.X"]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: poetry install --no-root --all-extras
      - name: Check compliance with code formatting guidelines
        run: poetry run ruff format --no-cache --check
      - name: Run lint checks
        run: poetry run ruff check --output-format=github
      - name: Run type checks
        # mypy passes without the compiled parser, so this job needs no C++ build.
        run: poetry run mypy --show-error-codes --pretty

  testing:
    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: true
      matrix:
        # Every Python version on Ubuntu, and 3.12 on macOS and Windows. Ubuntu with 3.12 is
        # the coverage job.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the C++ parser
        uses: ./.github/actions/build-cpp-parser
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: poetry install --no-root --all-extras
      - name: Run tests with pandas backend
        env:
          VTL_ENGINE_BACKEND: pandas
        run: poetry run pytest -n auto --dist worksteal --verbose --tb=short --durations=10
      - name: Run tests with duckdb backend
        env:
          VTL_ENGINE_BACKEND: duckdb
        run: poetry run pytest -n auto --dist worksteal --verbose --tb=short --strict-markers --strict-config --durations=10

  coverage:
    # The tests on Ubuntu with Python 3.12, measuring the coverage of both passes. The
    # sys.monitoring core (Python 3.12+) measures it at no visible cost; the default tracer
    # slowed the DuckDB pass by a fifth.
    runs-on: ubuntu-latest
    env:
      COVERAGE_CORE: sysmon

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the C++ parser
        uses: ./.github/actions/build-cpp-parser
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: poetry install --no-root --all-extras
      - name: Run tests with pandas backend
        env:
          VTL_ENGINE_BACKEND: pandas
        run: poetry run pytest --cov=vtlengine --cov-append --cov-report= -n auto --dist worksteal --verbose --tb=short --durations=10
      - name: Run tests with duckdb backend
        env:
          VTL_ENGINE_BACKEND: duckdb
        run: poetry run pytest --cov=vtlengine --cov-append -n auto --dist worksteal --verbose --tb=short --strict-markers --strict-config --durations=10
      - name: Check coverage
        run: poetry run coverage report --fail-under=85
