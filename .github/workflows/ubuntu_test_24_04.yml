name: Ubuntu 24.04 Tests

on:
  pull_request:
    branches: ["main", "1.9.X"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the dependencies
        uses: ./.github/actions/install-ubuntu-2404-deps

      - name: Build the C++ parser
        uses: ./.github/actions/build-cpp-parser
        with:
          python-version: "3.12"
          cache-prefix: ubuntu2404
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"

      - name: Run tests (pandas backend)
        env:
          VTL_ENGINE_BACKEND: pandas
        run: pytest -n auto --dist worksteal --verbose --tb=short --strict-markers --strict-config --durations=10

      - name: Run tests (duckdb backend)
        env:
          VTL_ENGINE_BACKEND: duckdb
        run: pytest -n auto --dist worksteal --verbose --tb=short --strict-markers --strict-config --durations=10

      - name: Run the operator map's tests
        run: >-
          pytest -p no:cacheprovider -o python_files='check_*.py'
          -o pythonpath="src docs/operator_map" docs/operator_map/tool/tests -q

      - name: Check the operator map's catalogue and examples
        run: python3 docs/operator_map/generate.py --check-only

      - name: Compare the engine with the operator map
        run: python3 docs/operator_map/generate.py --compare --summary "$GITHUB_STEP_SUMMARY"
